- name: "Setup {{ app_name }} Database"
  gather_facts: no
  vars_files:
    - vars/prod.yml
  hosts: castle
  remote_user: "{{ remote_admin }}"
  tasks:
    - name: "Create database {{ app_name }}"
      become_user: postgres
      become: yes
      postgresql_db:
        state: present
        name: "{{ app_name }}"
        port: "{{ db_port }}"

    - name: "Create db user {{ app_name }}"
      become_user: postgres
      become: yes
      postgresql_user:
        state: present
        name: "{{ app_name }}"
        password: "{{ db_password }}"
        port: "{{ db_port }}"

    - name: "Create schema {{ app_name }}"
      become_user: postgres
      become: yes
      postgresql_schema:
        state: present
        name: "{{ app_name }}"
        owner: "{{ app_name }}"
        login_password: "{{ db_password }}"
        login_port: "{{ db_port }}"
        login_db: "{{ app_name }}"
        comment: 'Radar Event Saver schema'

    - name: "Create schema liquibase"
      become_user: postgres
      become: yes
      postgresql_schema:
        state: present
        name: liquibase
        owner: "{{ app_name }}"
        login_password: "{{ db_password }}"
        login_port: "{{ db_port }}"
        login_db: "{{ app_name }}"
        comment: 'Liquibase schema'

    - name: "Grant db user {{ app_name }} access to app db {{ app_name }}"
      become_user: postgres
      become: yes
      postgresql_privs:
        type: database
        database: "{{ app_name }}"
        roles: "{{ app_name }}"
        grant_option: no
        privs: all
        port: "{{ db_port }}"

    - name: "Start service postgresql"
      become: yes
      systemd:
        name: postgresql
        state: started
