spring.rabbitmq.host=localhost
spring.rabbitmq.port=5673
spring.rabbitmq.username=username
spring.rabbitmq.password=password

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:schema.sql'
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=radar_eventsaver
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate

spring.liquibase.change-log=classpath:db/changelog/master.xml
spring.liquibase.default-schema=RADAR_EVENTSAVER
spring.liquibase.liquibase-schema=LIQUIBASE

#spring.sql.init.mode=always
#spring.jpa.defer-datasource-initialization=false
